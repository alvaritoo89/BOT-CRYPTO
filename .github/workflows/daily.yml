name: Noticias crypto diarias

on:
  schedule:
    # 07:00 UTC = 09:00 en España (horario de verano) / 08:00 (invierno)
    - cron: "0 7 * * *"
  workflow_dispatch: # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write # necesario para guardar docs/data.json

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Guardar datos para la web
        run: |
          git config user.name "crypto-bot"
          git config user.email "crypto-bot@users.noreply.github.com"
          git add docs/data.json
          git diff --staged --quiet || git commit -m "Actualizar noticias $(date -u +%F)"
          git push
